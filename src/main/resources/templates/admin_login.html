<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Login | EliteStudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep:      #0a061a;
            --aurora-1:     #3a1c71;
            --aurora-2:     #d76d77;
            --aurora-3:     #ffaf7b;
            --accent-main:  #a855f7;
            --accent-pink:  #ec4899;
            --accent-cyan:  #06b6d4;
            --glass-bg:     rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-ghost:   #e2e8f0;
            --text-dim:     #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-ghost);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        /* --- IMMERSIVE AURORA BACKGROUND --- */
        .aurora-container {
            position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
        }
        .aurora {
            position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.3;
            animation: auroraMove 25s infinite alternate;
        }
        .aurora-1 { width: 80vw; height: 80vh; background: var(--aurora-1); top: -20%; left: -20%; }
        .aurora-2 { width: 70vw; height: 70vh; background: var(--aurora-2); bottom: -10%; right: -10%; animation-delay: -5s; }
        .aurora-3 { width: 50vw; height: 50vh; background: var(--aurora-3); top: 30%; right: 10%; animation-delay: -10s; }

        @keyframes auroraMove {
            0%   { transform: translate(0,0) rotate(0deg) scale(1); }
            100% { transform: translate(100px, 50px) rotate(30deg) scale(1.1); }
        }

        .login-card {
            position: relative; z-index: 10;
            width: 100%; max-width: 440px;
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 50px 45px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
            animation: cardReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardReveal {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--accent-main), var(--accent-pink));
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 1.6rem; margin: 0 auto 25px;
            box-shadow: 0 15px 35px rgba(168, 85, 247, 0.4);
        }

        .card-title {
            font-family: 'Nunito', sans-serif; font-size: 2.2rem; font-weight: 900;
            text-align: center; letter-spacing: -1px; margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .card-sub {
            font-size: 0.8rem; font-weight: 700; color: var(--accent-cyan);
            text-align: center; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 40px;
        }

        .form-label {
            display: block; font-size: 0.75rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-dim);
            margin-bottom: 10px; padding-left: 5px;
        }

        .input-wrap { position: relative; margin-bottom: 25px; }
        .input-icon {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            color: var(--accent-main); font-size: 1rem;
        }

        .form-input {
            width: 100%; padding: 16px 20px 16px 52px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            font-family: inherit; font-size: 0.95rem; font-weight: 500;
            color: white; outline: none; transition: all 0.3s;
        }

        .form-input:focus {
            background: rgba(255,255,255,0.06);
            border-color: var(--accent-main);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.15);
        }

        .btn-primary {
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, var(--accent-main), var(--accent-pink));
            color: white; font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 900;
            border: none; border-radius: 18px; cursor: pointer;
            box-shadow: 0 15px 35px rgba(168, 85, 247, 0.3);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; align-items: center; justify-content: center; gap: 12px;
            margin-top: 10px; text-transform: uppercase; letter-spacing: 0.1em;
        }

        .btn-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(168, 85, 247, 0.5);
        }

        .error-msg {
            background: rgba(236, 72, 153, 0.1);
            border: 1px solid rgba(236, 72, 153, 0.3);
            color: #fca5a5; border-radius: 15px; padding: 14px;
            font-size: 0.85rem; font-weight: 700; text-align: center;
            margin-top: 25px; display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .secure-note {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 0.7rem; color: var(--text-dim); font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.12em; margin-top: 35px;
        }
    </style>
</head>
<body>
    <div class="aurora-container">
        <div class="aurora aurora-1"></div>
        <div class="aurora aurora-2"></div>
        <div class="aurora aurora-3"></div>
    </div>

    <div class="login-card">
        <div class="logo-icon"><i class="fas fa-shield-halved"></i></div>
        <h1 class="card-title">Admin Console</h1>
        <p class="card-sub">Secure Governance Portal</p>

        <form th:action="@{/admin/do-login}" method="post">
            <div>
                <label class="form-label">Administrator ID</label>
                <div class="input-wrap">
                    <i class="fas fa-user-shield input-icon"></i>
                    <input type="email" name="email" class="form-input" placeholder="admin@livestudio.com" required>
                </div>
            </div>
            <div>
                <label class="form-label">Security Key</label>
                <div class="input-wrap">
                    <i class="fas fa-key input-icon"></i>
                    <input type="password" name="password" class="form-input" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn-primary">
                <i class="fas fa-unlock-keyhole"></i> Authorize Access
            </button>
        </form>

        <p th:if="${param.error}" class="error-msg">
            <i class="fas fa-exclamation-triangle"></i> Authorization Failed. Invalid Credentials.
        </p>

        <div class="secure-note">
            <i class="fas fa-lock" style="color:var(--accent-cyan)"></i>
            Governance Level Security · AES-256
        </div>
    </div>
</body>
</html>
