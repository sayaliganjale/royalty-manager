<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Ticket | EliteStudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep:      #0a061a;
            --aurora-1:     #3a1c71;
            --aurora-2:     #d76d77;
            --aurora-3:     #ffaf7b;
            --accent-main:  #a855f7;
            --accent-pink:  #ec4899;
            --accent-cyan:  #06b6d4;
            --glass-bg:     rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-ghost:   #e2e8f0;
            --text-dim:     #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-ghost);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* --- IMMERSIVE AURORA BACKGROUND --- */
        .aurora-container {
            position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
        }
        .aurora {
            position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.3;
            animation: auroraMove 25s infinite alternate;
        }
        .aurora-1 { width: 80vw; height: 80vh; background: var(--aurora-1); top: -20%; left: -20%; }
        .aurora-2 { width: 70vw; height: 70vh; background: var(--aurora-2); bottom: -10%; right: -10%; animation-delay: -5s; }
        .aurora-3 { width: 50vw; height: 50vh; background: var(--aurora-3); top: 30%; right: 10%; animation-delay: -10s; }

        @keyframes auroraMove {
            0%   { transform: translate(0,0) rotate(0deg) scale(1); }
            100% { transform: translate(100px, 50px) rotate(30deg) scale(1.1); }
        }

        .back-link {
            position: fixed; top: 30px; left: 30px; z-index: 200;
            display: inline-flex; align-items: center; gap: 10px;
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); padding: 12px 24px;
            border-radius: 50px; font-size: 0.8rem; font-weight: 800;
            color: var(--text-ghost); text-decoration: none;
            text-transform: uppercase; letter-spacing: 0.1em;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .back-link:hover {
            background: white; color: black; transform: translateX(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(255,255,255,0.2);
        }

        .checkout-card {
            position: relative; z-index: 10;
            width: 100%; max-width: 1000px;
            background: var(--glass-bg); backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border); border-radius: 40px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
            animation: cardReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @media(min-width: 768px) { .checkout-card { flex-direction: row; } }

        @keyframes cardReveal {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .details-pane {
            flex: 0 0 38%; padding: 50px 40px;
            background: rgba(255,255,255,0.02);
            border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .details-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 6px 14px; border-radius: 20px; margin-bottom: 25px;
            font-size: 0.7rem; font-weight: 800; letter-spacing: 0.15em;
            text-transform: uppercase; color: var(--accent-main);
        }
        .details-badge .dot { width: 6px; height: 6px; background: var(--accent-main); border-radius: 50%; box-shadow: 0 0 10px var(--accent-main); animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

        .event-title {
            font-family: 'Nunito', sans-serif; font-size: 2.2rem; font-weight: 900;
            line-height: 1.1; letter-spacing: -1px; margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .event-artist { font-size: 1rem; font-weight: 700; color: var(--accent-cyan); margin-bottom: 40px; text-transform: uppercase; letter-spacing: 0.1em; }

        .detail-item { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
        .detail-icon {
            width: 44px; height: 44px; border-radius: 14px;
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
        }
        .detail-label { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 2px; }
        .detail-value { font-size: 0.95rem; font-weight: 600; color: white; }

        .price-block {
            background: rgba(168, 85, 247, 0.05); border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 24px; padding: 25px; margin-top: 40px;
        }
        .price-label { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-dim); margin-bottom: 5px; }
        .price-amount { font-family: 'Nunito', sans-serif; font-size: 3rem; font-weight: 900; color: white; letter-spacing: -1px; }

        .checkout-pane { flex: 1; padding: 50px 45px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
        .section-title { font-size: 1.5rem; font-weight: 900; color: white; }
        .secure-badge {
            display: inline-flex; align-items: center; gap: 8px; font-size: 0.7rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.2);
            padding: 6px 14px; border-radius: 20px;
        }

        .form-label { display: block; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 8px; padding-left: 5px; }
        .form-input {
            width: 100%; padding: 14px 18px; background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border); border-radius: 16px;
            font-family: inherit; font-size: 0.95rem; color: white; outline: none; transition: all 0.3s;
        }
        .form-input:focus { border-color: var(--accent-main); background: rgba(255,255,255,0.06); box-shadow: 0 0 20px rgba(168, 85, 247, 0.1); }
        .form-input::placeholder { color: rgba(255,255,255,0.2); }

        .tier-card {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; border-radius: 18px; border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.02); cursor: pointer; transition: all 0.3s; margin-bottom: 10px;
        }
        .tier-card:hover { border-color: var(--accent-main); background: rgba(255,255,255,0.05); }
        .tier-option input:checked + .tier-card {
            border-color: var(--accent-main); background: rgba(168, 85, 247, 0.1);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.1);
        }
        .tier-name { font-weight: 800; font-size: 1rem; color: white; }
        .tier-desc { font-size: 0.75rem; color: var(--text-dim); }
        .tier-mult {
            font-size: 0.7rem; font-weight: 800; background: rgba(255,255,255,0.05);
            color: var(--accent-cyan); padding: 4px 12px; border-radius: 20px;
        }
        .tier-option input:checked + .tier-card .tier-mult { background: var(--accent-cyan); color: black; }

        .btn-pay {
            width: 100%; padding: 20px;
            background: linear-gradient(135deg, var(--accent-main), var(--accent-pink));
            color: white; font-family: 'Nunito', sans-serif; font-size: 1.1rem; font-weight: 900;
            border: none; border-radius: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 20px 40px rgba(168, 85, 247, 0.3);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-top: 30px; text-transform: uppercase; letter-spacing: 0.1em;
        }
        .btn-pay:hover { transform: translateY(-5px); box-shadow: 0 30px 60px rgba(168, 85, 247, 0.5); }

        .secure-footer { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.75rem; color: var(--text-dim); font-weight: 700; margin-top: 25px; text-transform: uppercase; letter-spacing: 0.1em; }
        
        .mb25 { margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        
        /* Hide native radio */
        .tier-option input[type="radio"] { position: absolute; opacity: 0; }
    </style>
</head>
<body>
    <div class="aurora-container">
        <div class="aurora aurora-1"></div>
        <div class="aurora aurora-2"></div>
        <div class="aurora aurora-3"></div>
    </div>

    <a th:href="@{/events}" class="back-link"><i class="fas fa-arrow-left"></i> BACK TO EVENTS</a>

    <div class="checkout-card">
        <!-- LEFT PANE -->
        <div class="details-pane">
            <div>
                <div class="details-badge"><span class="dot"></span> SECURE CHECKOUT</div>
                <h1 class="event-title" th:text="${event.name}">Event Name</h1>
                <p class="event-artist" th:text="${event.artist.name}">Artist</p>
                
                <div class="detail-item">
                    <div class="detail-icon" style="color:var(--accent-main)"><i class="fas fa-calendar-alt"></i></div>
                    <div>
                        <div class="detail-label">Date</div>
                        <div class="detail-value" th:text="${#temporals.format(event.eventDate, 'MMMM dd, yyyy')}">Date</div>
                    </div>
                </div>
                
                <div class="detail-item">
                    <div class="detail-icon" style="color:var(--accent-pink)"><i class="fas fa-location-dot"></i></div>
                    <div>
                        <div class="detail-label">Venue</div>
                        <div class="detail-value" th:text="${event.venue}">Venue</div>
                    </div>
                </div>
            </div>
            
            <div class="price-block">
                <div class="price-label">Base Ticket Price</div>
                <div class="price-amount" th:text="${'$' + #numbers.formatDecimal(event.ticketPrice, 1, 2)}">$0.00</div>
            </div>
        </div>

        <!-- RIGHT PANE -->
        <div class="checkout-pane">
            <div class="section-header">
                <h2 class="section-title">Book your <span style="color:var(--accent-main)">Experience</span></h2>
                <div class="secure-badge"><i class="fas fa-shield-halved"></i> SECURE</div>
            </div>

            <form th:action="@{'/events/' + ${event.id} + '/purchase'}" method="post">
                <div class="form-grid mb25">
                    <div>
                        <label class="form-label">Full Name</label>
                        <input type="text" name="buyerName" class="form-input" placeholder="Jane Smith" required>
                    </div>
                    <div>
                        <label class="form-label">Email Address</label>
                        <input type="email" name="buyerEmail" class="form-input" placeholder="jane@example.com" required>
                    </div>
                </div>

                <div class="mb25">
                    <label class="form-label">Select Tier</label>
                    <div class="tier-option">
                        <input type="radio" name="ticketType" id="tier-ga" value="General Admission" checked onchange="updateTotal()">
                        <label class="tier-card" for="tier-ga">
                            <div><div class="tier-name">General Admission</div><div class="tier-desc">Standard entry to the event</div></div>
                            <div class="tier-mult">1.0× BASE</div>
                        </label>
                    </div>
                    <div class="tier-option">
                        <input type="radio" name="ticketType" id="tier-vip" value="VIP Access" onchange="updateTotal()">
                        <label class="tier-card" for="tier-vip">
                            <div><div class="tier-name">VIP Access</div><div class="tier-desc">Early entry + premium seats</div></div>
                            <div class="tier-mult">2.0× BASE</div>
                        </label>
                    </div>
                </div>

                <div class="mb25">
                    <label class="form-label">Quantity</label>
                    <select name="quantity" id="ticketQty" class="form-input" onchange="updateTotal()" required>
                        <option value="1">1 Ticket</option>
                        <option value="2">2 Tickets</option>
                        <option value="3">3 Tickets</option>
                        <option value="4">4 Tickets</option>
                        <option value="5">5 Tickets (Max)</option>
                    </select>
                </div>

                <input type="hidden" name="amount" id="formAmount" th:value="${event.ticketPrice}">

                <div style="border-top: 1px solid var(--glass-border); padding-top: 25px; margin-top: 10px;">
                    <label class="form-label">Payment Detail</label>
                    <div class="mb25">
                        <input type="text" class="form-input" placeholder="0000  0000  0000  0000" maxlength="19" required>
                    </div>
                    <div class="form-grid">
                        <input type="text" class="form-input" placeholder="MM / YY" maxlength="5" required>
                        <input type="password" class="form-input" placeholder="CVV" maxlength="3" required>
                    </div>
                </div>

                <button type="submit" class="btn-pay">
                    <span style="display:flex;align-items:center;gap:15px"><i class="fas fa-lock"></i> CONFIRM & PAY</span>
                    <span id="submitTotal" th:text="${'$' + #numbers.formatDecimal(event.ticketPrice, 1, 2)}">$0.00</span>
                </button>
                
                <div class="secure-footer">
                    <i class="fas fa-shield-halved" style="color:var(--accent-cyan)"></i> 
                    256-BIT SSL · PAYMENTS SECURED
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const unitPrice = /*[[${event.ticketPrice}]]*/ 0;
        function getMultiplier() {
            const types = document.getElementsByName('ticketType');
            for (let i = 0; i < types.length; i++) {
                if (types[i].checked) {
                    if (types[i].value === 'VIP Access') return 2.0;
                    return 1.0;
                }
            }
            return 1.0;
        }
        function updateTotal() {
            const qty = parseInt(document.getElementById('ticketQty').value);
            const total = (qty * unitPrice * getMultiplier()).toFixed(2);
            document.getElementById('submitTotal').innerText = '$' + total;
            document.getElementById('formAmount').value = total;
        }
        /*]]>*/
    </script>
</body>
</html>
