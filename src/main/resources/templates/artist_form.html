<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Artists & Payouts | EliteStudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep:      #0a061a;
            --aurora-1:     #3a1c71;
            --aurora-2:     #d76d77;
            --aurora-3:     #ffaf7b;
            --accent-main:  #a855f7;
            --accent-pink:  #ec4899;
            --accent-cyan:  #06b6d4;
            --accent-orange: #f59e0b;
            --accent-red:    #ef4444;
            --glass-bg:     rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-ghost:   #e2e8f0;
            --text-dim:     #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-ghost);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- IMMERSIVE AURORA BACKGROUND --- */
        .aurora-container {
            position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
        }
        .aurora {
            position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.2;
            animation: auroraMove 25s infinite alternate;
        }
        .aurora-1 { width: 80vw; height: 80vh; background: var(--aurora-1); top: -20%; left: -20%; }
        .aurora-2 { width: 70vw; height: 70vh; background: var(--aurora-2); bottom: -10%; right: -10%; animation-delay: -5s; }
        .aurora-3 { width: 50vw; height: 50vh; background: var(--aurora-3); top: 30%; right: 10%; animation-delay: -10s; }

        @keyframes auroraMove {
            0%   { transform: translate(0,0) rotate(0deg) scale(1); }
            100% { transform: translate(100px, 50px) rotate(30deg) scale(1.1); }
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px; flex-shrink: 0;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border-right: 1px solid var(--glass-border);
            padding: 40px 20px; display: flex; flex-direction: column;
            position: relative; z-index: 50;
            overflow-y: auto;
        }

        .logo-row { display: flex; align-items: center; gap: 15px; margin-bottom: 45px; padding: 0 10px; }
        .logo-icon {
            width: 44px; height: 44px; border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-main), var(--accent-pink));
            display: flex; align-items: center; justify-content: center; color: white;
            font-size: 1.1rem; box-shadow: 0 10px 20px rgba(168, 85, 247, 0.3);
        }
        .logo-text h1 { font-family: 'Nunito', sans-serif; font-size: 1.2rem; font-weight: 900; color: white; line-height: 1; }
        .logo-text p { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent-cyan); }

        .nav-label {
            font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.2em; color: var(--text-dim); padding: 0 12px;
            margin-bottom: 12px; margin-top: 30px;
        }

        .nav-link {
            display: flex; align-items: center; gap: 14px; padding: 12px 16px;
            border-radius: 16px; color: var(--text-dim); font-weight: 600;
            font-size: 0.88rem; text-decoration: none; transition: all 0.3s; margin-bottom: 5px;
        }
        .nav-link i { width: 20px; text-align: center; font-size: 1rem; }
        .nav-link:hover { color: white; background: rgba(255, 255, 255, 0.05); transform: translateX(5px); }
        .nav-link.active {
            color: white; background: rgba(168, 85, 247, 0.15);
            border-left: 4px solid var(--accent-main); border-radius: 4px 16px 16px 4px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.1);
        }

        /* --- MAIN CONTENT --- */
        .main { flex: 1; padding: 50px; overflow-y: auto; position: relative; z-index: 10; display: flex; flex-direction: column; }
        .main::-webkit-scrollbar { width: 6px; }
        .main::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

        .page-header { margin-bottom: 45px; }
        .page-title { font-family: 'Nunito', sans-serif; font-size: 2.8rem; font-weight: 900; color: white; letter-spacing: -1px; }
        .page-title span { background: linear-gradient(135deg, var(--accent-main), var(--accent-pink)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

        .form-container {
            display: flex; justify-content: center; align-items: flex-start; gap: 40px; flex-wrap: wrap;
        }

        .card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 36px; padding: 45px; backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px); width: 100%; max-width: 500px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        }

        .card-icon {
            width: 64px; height: 64px; border-radius: 20px;
            background: linear-gradient(135deg, var(--accent-main), var(--accent-cyan));
            display: flex; align-items: center; justify-content: center; color: white;
            font-size: 1.6rem; margin: 0 auto 25px; box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
        }

        .form-label { display: block; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); margin-bottom: 10px; padding-left: 5px; }
        
        .input-wrap { position: relative; margin-bottom: 25px; }
        .input-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--accent-main); font-size: 1rem; }
        .form-input {
            width: 100%; padding: 16px 18px 16px 50px; background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border); border-radius: 18px;
            font-family: inherit; font-size: 0.95rem; color: white; outline: none; transition: all 0.3s;
        }
        .form-input:focus { border-color: var(--accent-main); background: rgba(255,255,255,0.06); box-shadow: 0 0 20px rgba(168, 85, 247, 0.15); }
        .form-input::placeholder { color: rgba(255,255,255,0.2); }

        .btn-submit {
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, var(--accent-main), var(--accent-pink));
            color: white; font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 900;
            border: none; border-radius: 20px; cursor: pointer;
            box-shadow: 0 15px 30px rgba(168, 85, 247, 0.3);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; align-items: center; justify-content: center; gap: 12px;
            text-transform: uppercase; letter-spacing: 0.1em; margin-top: 10px;
        }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 20px 40px rgba(168, 85, 247, 0.5); }

        .secure-note {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-size: 0.7rem; color: var(--text-dim); font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.1em; margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="aurora-container">
        <div class="aurora aurora-1"></div>
        <div class="aurora aurora-2"></div>
        <div class="aurora aurora-3"></div>
    </div>

    <aside class="sidebar">
        <div class="logo-row">
            <div class="logo-icon"><i class="fas fa-layer-group"></i></div>
            <div class="logo-text"><h1>EliteStudio</h1><p>Admin Control</p></div>
        </div>
        
        <div class="nav-label">Management</div>
        <a th:href="@{/dashboard}" class="nav-link"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a th:href="@{/add-artist}" class="nav-link active"><i class="fas fa-users-gear"></i> Artists & Payouts</a>
        <a th:href="@{/label/track-registration}" class="nav-link"><i class="fas fa-compact-disc"></i> Track Registry</a>
        <a th:href="@{/admin/events}" class="nav-link"><i class="fas fa-calendar-star"></i> Live Events</a>
        <a th:href="@{/label/analytics}" class="nav-link"><i class="fas fa-chart-line"></i> Analytics</a>
        
        <div class="nav-label">Rule Engine</div>
        <a th:href="@{/admin/platforms}" class="nav-link"><i class="fas fa-tower-broadcast"></i> Platforms</a>
        <a th:href="@{/admin/royalty-rules}" class="nav-link"><i class="fas fa-sliders"></i> Royalty Rules</a>
        <a th:href="@{/admin/region-rates}" class="nav-link"><i class="fas fa-globe"></i> Region Rates</a>
        <a th:href="@{/admin/contract-types}" class="nav-link"><i class="fas fa-file-contract"></i> Contract Types</a>
        <a th:href="@{/admin/revenue-share}" class="nav-link"><i class="fas fa-handshake"></i> Revenue Share</a>
        <a th:href="@{/admin/dispute-rules}" class="nav-link"><i class="fas fa-flag"></i> Dispute Rules</a>
        <a th:href="@{/admin/calc-engine}" class="nav-link"><i class="fas fa-calculator"></i> Calc Engine</a>
        <a th:href="@{/admin/audit-logs}" class="nav-link"><i class="fas fa-scroll"></i> Audit Logs</a>
        
        <div style="margin-top:auto">
            <a th:href="@{/admin/logout}" class="nav-link" style="color:var(--accent-red)"><i class="fas fa-right-from-bracket"></i> Logout</a>
        </div>
    </aside>

    <main class="main">
        <div class="page-header">
            <h2 class="page-title">Artist <span>Onboarding</span></h2>
        </div>

        <div class="form-container">
            <div class="card">
                <div class="card-icon"><i class="fas fa-user-plus"></i></div>
                <form th:action="@{/save-artist}" th:object="${artist}" method="post">
                    <div class="form-group">
                        <label class="form-label">Artist / Stage Name</label>
                        <div class="input-wrap">
                            <i class="fas fa-microphone input-icon"></i>
                            <input type="text" th:field="*{name}" class="form-input" placeholder="e.g. Noah Rodes" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Primary Email Address</label>
                        <div class="input-wrap">
                            <i class="fas fa-at input-icon"></i>
                            <input type="email" th:field="*{email}" class="form-input" placeholder="artist@elitestudio.com" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-user-check"></i> REGISTER ARTIST
                    </button>
                </form>

                <div class="secure-note">
                    <i class="fas fa-shield-check" style="color:var(--accent-cyan)"></i>
                    SECURE REGISTRATION PROTOCOL ACTIVE
                </div>
            </div>

            <!-- Optional: Payouts/Artists list could be added here if needed, but the user requested "forms" mostly -->
        </div>
    </main>
</body>
</html>
