<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Profile | LiveStudio Artist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--pl:#e8e0f5;--pr:#fce8ee;--pm:#ddf5ee;--ps:#dceefb;--pp:#fdecd8;--ap:#9b7fd4;--ak:#e07ca0;--at:#4daa90;--ab:#5ba3d9;--ao:#e8965a;--td:#2d2746;--tm:#6b6489;--tl:#a09bbf;--cb:rgba(180,160,220,0.22);}
        *{box-sizing:border-box;margin:0;padding:0;}
        body{background:linear-gradient(135deg,#f0ebff 0%,#fce8ee 40%,#dceefb 75%,#ddf5ee 100%);font-family:'Inter',sans-serif;color:var(--td);min-height:100vh;display:flex;overflow-x:hidden;}
        h1,h2,h3,h4,h5{font-family:'Nunito',sans-serif;}
        .blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;z-index:0;pointer-events:none;animation:drift 20s ease-in-out infinite alternate;}
        .b1{width:460px;height:460px;background:var(--pl);top:-10%;left:10%;}
        .b2{width:360px;height:360px;background:var(--pr);top:50%;right:-5%;animation-delay:-8s;}
        .b3{width:300px;height:300px;background:var(--pm);bottom:-5%;left:30%;animation-delay:-14s;}
        @keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(32px,24px) scale(1.07)}}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

        /* SIDEBAR */
        .sidebar{width:240px;flex-shrink:0;background:rgba(255,255,255,0.75);backdrop-filter:blur(24px);border-right:1px solid var(--cb);padding:32px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:50;box-shadow:4px 0 24px rgba(155,127,212,0.07);}
        .logo-row{display:flex;align-items:center;gap:12px;margin-bottom:36px;padding:0 6px;}
        .logo-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--ap),var(--ak));display:flex;align-items:center;justify-content:center;color:white;font-size:1rem;box-shadow:0 6px 16px rgba(155,127,212,0.35);}
        .logo-text h1{font-size:1rem;font-weight:900;color:var(--td);}
        .logo-text p{font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--tl);}
        .nav-label{font-size:0.58rem;font-weight:800;text-transform:uppercase;letter-spacing:0.15em;color:var(--tl);padding:0 8px;margin-bottom:8px;margin-top:20px;}
        .nav-link{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--tm);font-weight:600;font-size:0.82rem;text-decoration:none;transition:all 0.2s;margin-bottom:3px;}
        .nav-link i{width:16px;text-align:center;font-size:0.85rem;}
        .nav-link:hover{color:var(--td);background:rgba(155,127,212,0.08);transform:translateX(3px);}
        .nav-link.active{color:var(--ap);background:var(--pl);border-left:3px solid var(--ap);border-radius:0 11px 11px 0;font-weight:700;}
        .sidebar-footer{padding-top:20px;margin-top:auto;}
        .btn-dispute{width:100%;padding:10px;background:rgba(224,124,160,0.1);border:1px solid rgba(224,124,160,0.3);color:var(--ak);border-radius:12px;font-family:'Nunito',sans-serif;font-size:0.78rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all 0.2s;margin-bottom:10px;}
        .btn-dispute:hover{background:var(--pr);border-color:var(--ak);}
        .signout{display:block;text-align:center;font-size:0.68rem;color:var(--tl);font-weight:600;text-decoration:none;text-transform:uppercase;letter-spacing:0.1em;transition:color 0.2s;}
        .signout:hover{color:var(--td);}

        /* MAIN */
        .main{flex:1;padding:40px 44px;overflow-y:auto;max-height:100vh;position:relative;z-index:1;}
        .main::-webkit-scrollbar{width:5px;}
        .main::-webkit-scrollbar-thumb{background:var(--pl);border-radius:10px;}
        .page-header{margin-bottom:36px;}
        .page-title{font-size:2.2rem;font-weight:900;color:var(--td);letter-spacing:-0.8px;}
        .page-title span{background:linear-gradient(135deg,var(--ap),var(--ak));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
        .page-sub{font-size:0.82rem;color:var(--tm);margin-top:4px;font-weight:500;}

        /* PANEL */
        .panel{background:rgba(255,255,255,0.88);border:1px solid var(--cb);border-radius:24px;box-shadow:0 8px 32px rgba(155,127,212,0.09);overflow:hidden;margin-bottom:28px;}
        .panel-header{padding:20px 28px;border-bottom:1px solid rgba(180,160,220,0.15);display:flex;align-items:center;gap:10px;}
        .panel-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0;}
        .panel-title{font-size:0.95rem;font-weight:800;color:var(--td);}
        .panel-body{padding:28px;}

        /* FORM */
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
        .form-group{margin-bottom:0;}
        .form-label{display:block;font-size:0.65rem;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--tl);margin-bottom:7px;}
        .form-input{width:100%;padding:12px 15px;background:rgba(248,246,255,0.9);border:1.5px solid rgba(180,160,220,0.28);border-radius:12px;font-family:'Inter',sans-serif;font-size:0.87rem;font-weight:600;color:var(--td);outline:none;transition:all 0.2s;}
        .form-input:focus{border-color:var(--ap);box-shadow:0 0 0 4px rgba(155,127,212,0.1);background:white;}
        .form-input::placeholder{color:var(--tl);font-weight:400;}
        .form-input[readonly]{background:rgba(248,246,255,0.5);color:var(--tm);cursor:default;}
        .readonly-badge{display:inline-flex;align-items:center;gap:5px;font-size:0.6rem;font-weight:700;color:var(--tl);text-transform:uppercase;letter-spacing:0.08em;margin-left:6px;}

        .warning-box{background:rgba(232,150,90,0.08);border:1px solid rgba(232,150,90,0.25);border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:12px;margin-bottom:20px;}
        .warning-box i{color:var(--ao);font-size:1.1rem;flex-shrink:0;}
        .warning-box p{font-size:0.78rem;color:var(--td);font-weight:600;}

        .btn-save{padding:14px 28px;background:linear-gradient(135deg,var(--ap),var(--ak));color:white;font-family:'Nunito',sans-serif;font-size:0.9rem;font-weight:900;border:none;border-radius:14px;cursor:pointer;box-shadow:0 6px 20px rgba(155,127,212,0.3);transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1),box-shadow 0.25s;display:inline-flex;align-items:center;gap:8px;}
        .btn-save:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(155,127,212,0.44);}
        .divider{border:none;border-top:1px solid rgba(180,160,220,0.18);margin:8px 0 24px;}

        .info-chip{display:inline-flex;align-items:center;gap:6px;background:var(--pl);color:var(--ap);font-size:0.68rem;font-weight:700;padding:5px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:0.08em;}
    </style>
</head>
<body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo-row">
            <div class="logo-icon"><i class="fas fa-music"></i></div>
            <div class="logo-text">
                <h1>LiveStudio</h1>
                <p>Artist Portal</p>
            </div>
        </div>
        <div class="nav-label">Studio</div>
        <a href="#" class="nav-link"><i class="fas fa-chart-line"></i> Dashboard</a>
        <a th:href="@{/artist/payments}" class="nav-link"><i class="fas fa-coins"></i> Royalties</a>
        <a th:href="@{/artist/profile}" class="nav-link active"><i class="fas fa-id-card"></i> My Profile</a>
        <div class="sidebar-footer">
            <a th:href="@{/artist/logout}" class="signout"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
        <div class="page-header">
            <h2 class="page-title">My <span>Profile</span></h2>
            <p class="page-sub">Manage your artist identity and payment details</p>
        </div>

        <!-- Identity panel -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-icon" style="background:var(--pl);color:var(--ap)"><i class="fas fa-id-card"></i></div>
                <span class="panel-title">Artist Identity</span>
                <div class="info-chip" style="margin-left:auto"><i class="fas fa-shield-halved"></i> Verified</div>
            </div>
            <div class="panel-body">
                <div class="form-grid" style="margin-bottom:0">
                    <div class="form-group">
                        <label class="form-label">Artist / Stage Name <span class="readonly-badge"><i class="fas fa-lock"></i> read-only</span></label>
                        <input type="text" class="form-input" th:value="${artist.name}" readonly>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email Address <span class="readonly-badge"><i class="fas fa-lock"></i> read-only</span></label>
                        <input type="email" class="form-input" th:value="${artist.email}" readonly>
                    </div>
                </div>
            </div>
        </div>

        <!-- Payment panel -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-icon" style="background:var(--pm);color:var(--at)"><i class="fas fa-university"></i></div>
                <span class="panel-title">Payment & Banking Details</span>
            </div>
            <div class="panel-body">
                <div class="warning-box">
                    <i class="fas fa-triangle-exclamation"></i>
                    <p>Banking details are used for royalty disbursements. Please ensure all information is accurate.</p>
                </div>
                <form class="space-y-0">
                    <div class="form-grid" style="margin-bottom:20px">
                        <div>
                            <label class="form-label">Bank Name</label>
                            <input type="text" class="form-input" placeholder="e.g. National Bank">
                        </div>
                        <div>
                            <label class="form-label">Account Number</label>
                            <input type="password" class="form-input" placeholder="••••••••••••">
                        </div>
                    </div>
                    <div class="form-grid">
                        <div>
                            <label class="form-label">IFSC / SWIFT Code</label>
                            <input type="text" class="form-input" placeholder="e.g. BANK0001234">
                        </div>
                        <div>
                            <label class="form-label">Tax Identification Number</label>
                            <input type="text" class="form-input" placeholder="Tax / PAN ID">
                        </div>
                    </div>
                    <hr class="divider">
                    <button type="button" class="btn-save">
                        <i class="fas fa-save"></i> Save Banking Details
                    </button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
